[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./contracts/test/fixtures" }]
# The generated proof verifier is just over the contract size limit at 200 optimizer runs, so it alone is built for size.
additional_compiler_profiles = [{ name = "size", optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "contracts/src/zk/HonkVerifier.sol", optimizer_runs = 1 }]
